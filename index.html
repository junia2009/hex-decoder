<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeXデコーダー</title>
    <style>
        body {
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(ellipse at center, #232b38 0%, #0a0f18 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #00ffe7;
        }
        .container {
            max-width: 500px;
            margin: 60px auto 0 auto;
            background: rgba(20, 30, 40, 0.95);
            border-radius: 16px;
            box-shadow: 0 0 32px 4px #00ffe7a0, 0 2px 16px #000a;
            padding: 40px 32px 32px 32px;
            border: 2px solid #00ffe7;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #00ffe7;
            font-size: 2.2em;
            letter-spacing: 0.12em;
            text-shadow: 0 0 12px #00ffe7, 0 0 32px #007bff80;
            margin-bottom: 32px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #00ffe7;
            background: #10151f;
            color: #00ffe7;
            font-size: 18px;
            resize: vertical;
            margin-bottom: 20px;
            box-shadow: 0 0 8px #00ffe7a0 inset;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus {
            border: 2px solid #007bff;
            box-shadow: 0 0 16px #007bff80;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00ffe7 0%, #007bff 100%);
            color: #10151f;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 0 16px #00ffe7a0;
            letter-spacing: 0.08em;
            transition: background 0.2s, color 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #007bff 0%, #00ffe7 100%);
            color: #00ffe7;
        }
        .output {
            background: #10151f;
            border: 2px solid #00ffe7;
            border-radius: 8px;
            padding: 16px;
            min-height: 48px;
            font-size: 18px;
            word-break: break-all;
            color: #00ffe7;
            box-shadow: 0 0 8px #00ffe740 inset;
            margin-bottom: 0;
        }
        .error {
            color: #ff3c3c;
            background: #1a0a0a;
            border: 2px solid #ff3c3c;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: 0 0 8px #ff3c3c40 inset;
        }
        /* サイバーな装飾 */
        .container:before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 20px;
            border: 2px solid #007bff40;
            pointer-events: none;
            box-shadow: 0 0 32px #00ffe7a0;
        }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <h1>HeX Decoder</h1>
        <textarea id="hexInput" placeholder="16進数文字列を入力してください (例: 48656c6c6f)"></textarea>
        <button onclick="decodeHex()">DECODE</button>
        <div id="error" class="error" style="display:none;"></div>
        <div class="output" id="output"></div>
    </div>
    <script>
        function decodeHex() {
            const inputRaw = document.getElementById('hexInput').value.trim();
            const output = document.getElementById('output');
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';
            output.textContent = '';
            if (!inputRaw) {
                errorDiv.textContent = '16進数文字列を入力してください。';
                errorDiv.style.display = 'block';
                return;
            }
            // 半角スペース区切り対応: スペースを除去
            const input = inputRaw.replace(/\s+/g, '');
            if (!/^[0-9a-fA-F]+$/.test(input) || input.length % 2 !== 0) {
                errorDiv.textContent = '有効な16進数文字列を入力してください（偶数桁、または2桁ごとにスペース区切り）。';
                errorDiv.style.display = 'block';
                return;
            }
            try {
                let str = '';
                for (let i = 0; i < input.length; i += 2) {
                    str += String.fromCharCode(parseInt(input.substr(i, 2), 16));
                }
                output.textContent = str;
            } catch (e) {
                errorDiv.textContent = 'デコード中にエラーが発生しました。';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
